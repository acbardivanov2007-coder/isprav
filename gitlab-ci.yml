image: gcc:latest

stages:
  - format
  - build
  - test
  - coverage

check-format:
  stage: format
  before_script:
    - apt-get update -qq && apt-get install -y -qq clang-format
  script:
    - git ls-files '*.c' '*.h' | xargs clang-format -i --verbose
    - git diff --exit-code

build:
  stage: build
  script:
    - make

test:
  stage: test
  script:
    - make test

coverage:
  stage: coverage
  before_script:
    - apt-get update -qq && apt-get install -y -qq lcov
  script:
    - make coverage
  coverage: '/Line coverage:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - cov/html/
    expire_in: 1 week
